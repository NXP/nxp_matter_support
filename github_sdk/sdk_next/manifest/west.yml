# The west manifest file (west.yml) for MCUXpresso SDK delivery.
#
# See the west documentation for more information:
#
# https://docs.zephyrproject.org/latest/guides/west/index.html
manifest:
    projects:
        - name: mcuxsdk_manifest
          url: https://github.com/nxp-mcuxpresso/mcuxsdk-manifests
          revision: v25.06.00
          import:
              name-allowlist:
                  - freertos-kernel
                  - mcux-freertos-drivers
                  - mcux-devices-wireless
                  - CMSIS
                  - mcux-sdk-middleware-sdmmc
                  - fatfs
                  - ethermind
                  - mbedtls
                  - lwip
                  - littlefs
                  - ble_controller
                  - bluetooth
                  - edgefast_bt_ble
                  - ieee-802.15.4
                  - mcux-sdk-middleware-multicore
                  - usb
                  - rpmsg-lite
                  - secure-subsystem
                  - wifi_nxp
                  - wpa_supplicant-rtos
                  - fw_bin
                  - mcu-sdk-components
                  - mcu-sdk-examples
                  - els_pkc
                  - mcux-devices-rt
                  - mcux-devices-mcx
                  - mcux-mcmgr
                  - erpc
                  - usb
                  - mcuboot_opensource
              path-prefix: repo
        - name: core
          url: https://github.com/nxp-mcuxpresso/mcuxsdk-core
          revision: 746a3f564410d2aefca11c0dc689201af51a62e7
          path: repo/mcuxsdk/
          west-commands: scripts/west_commands.yml
        - name: framework
          url: https://github.com/nxp-mcuxpresso/mcuxsdk-middleware-connectivity-framework.git
          revision: aef9906340f6b5855f069e7952f401a8c8c41b96
          path: repo/mcuxsdk/middleware/wireless/framework/
        - name: bifrost
          url: https://github.com/nxp-zephyr/bifrost
          revision: main
          path: repo/bifrost
          groups:
              - bifrost
group-filter: [-bifrost]
