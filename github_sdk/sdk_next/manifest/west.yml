# The west manifest file (west.yml) for MCUXpresso SDK delivery.
#
# See the west documentation for more information:
#
# https://docs.zephyrproject.org/latest/guides/west/index.html
manifest:
    projects:
        - name: mcuxsdk_manifest
          url: https://github.com/nxp-mcuxpresso/mcuxsdk-manifests
          revision: v26.03.00
          import:
              name-allowlist:
                  - mcux-sdk-middleware-connectivity-framework
                  - freertos-kernel
                  - mcux-freertos-drivers
                  - mcux-devices-wireless
                  - CMSIS
                  - mcux-sdk-middleware-sdmmc
                  - fatfs
                  - ethermind
                  - mbedtls3x
                  - littlefs
                  - ble_controller
                  - bluetooth
                  - edgefast_bt_ble
                  - ieee-802.15.4
                  - XCVR
                  - mcux-sdk-middleware-multicore
                  - usb
                  - rpmsg-lite
                  - secure-subsystem
                  - wifi_nxp
                  - wpa_supplicant-rtos
                  - els_pkc
                  - mcux-devices-rt
                  - mcux-devices-mcx
                  - mcux-mcmgr
                  - erpc
                  - usb
                  - mcuboot_opensource
              path-prefix: repo
        - name: core
          url: https://github.com/nxp-mcuxpresso/mcuxsdk-core
          revision: 2656ba11af509b6ab9d8b808f6bfd4f2b95f74c0
          path: repo/mcuxsdk/
          west-commands: scripts/west_commands.yml
        - name: mcu-sdk-components
          url: https://github.com/nxp-mcuxpresso/mcux-component
          path: repo/mcuxsdk/components
          revision: e67b49539b52f6df45d76db4f565da427b007f7b
        - name: secure_storage
          url: https://github.com/nxp-mcuxpresso/secure_storage
          path: repo/mcuxsdk/middleware/secure_storage
          revision: 58a86d061b60fee59495172a760cb7039473d5b0
        - name: psa_crypto_driver
          url: https://github.com/NXP/psa_crypto_driver
          path: repo/mcuxsdk/components/psa_crypto_driver
          revision: 783de0018f94721ddf12cefbe42c58d65a439490
        - name: mbedtls3x
          url: https://github.com/NXP/nxp_mbedtls
          path: repo/mcuxsdk/middleware/mbedtls3x
          revision: 495d04b4093a8914380d7301c95dcddcc9eb86d2
        - name: fw_bin
          url: https://github.com/NXP/wifi_nb_fw
          revision: ffb1aa7ab4592ad50e0291177c1456ebe2d0bb5d
          path: repo/mcuxsdk/components/conn_fwloader/fw_bin
        - name: mcu-sdk-examples
          url: https://github.com/nxp-mcuxpresso/mcuxsdk-examples
          path: repo/mcuxsdk/examples
          revision: 481c7f1cb15caab55a8c11b6ff895e23fe16d801
        - name: wifi_nxp
          url: https://github.com/NXP/wifi_nxp
          path: repo/mcuxsdk/middleware/wifi_nxp
          revision: f79df9d70ce5ad049bbc7c7d0bf92297867f4e8d
        - name: ble_controller
          url: https://github.com/nxp-mcuxpresso/mcuxsdk-middleware-bluetooth-controller
          path: repo/mcuxsdk/middleware/wireless/ble_controller
          revision: 818dfe3ebb5830db7cb999afe306234f7f407154
        - name: ieee-802.15.4
          url: https://github.com/nxp-mcuxpresso/mcux-sdk-middleware-ieee_802.15.4
          path: repo/mcuxsdk/middleware/wireless/ieee-802.15.4
          revision: 511d1c09302f586da973deaefd43144d30aba762
        - name: lwip
          url: https://github.com/nxp-mcuxpresso/lwip
          path: repo/mcuxsdk/middleware/lwip
          revision: ddc007e9302d00c7ad026c2384724c2e0d82637d
        - name: bifrost
          url: https://github.com/nxp-zephyr/bifrost
          revision: main
          path: repo/bifrost
          groups:
              - bifrost
group-filter: [-bifrost]
